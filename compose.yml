services:
  portal:
    image: ${PORTAL_IMAGE:-student-portal:1.0}
    build: .
    container_name: student-portal
    environment:
      REDIS_HOST: redis
    ports:
      - "${PORTAL_PORT:-8080}:5000"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: student-portal-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
